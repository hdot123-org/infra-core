name: "Setup venv"
description: "Create and activate a Python virtual environment for CI jobs"

runs:
  using: "composite"
  steps:
    - name: Fast-fail on incomplete checkout
      shell: bash
      run: |
        set -e
        # 预装环境锁定第 3 层：checkout 残缺（半死 checkout）时立即失败，
        # 不让下游报迷惑性错误（2026-08-27 runner-02/03 工作区中毒事件）。
        missing=0
        for f in .git pyproject.toml .github/actions/setup-venv/action.yml; do
          if [ ! -e "$f" ]; then
            echo "::error::仓库关键文件缺失：$f —— checkout 残缺（半死 checkout），请 rerun 本 job 或清理 runner 工作区后重试"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "✓ checkout 完整性检查通过（.git / pyproject.toml / setup-venv action.yml）"

    - name: Create venv
      shell: bash
      run: |
        set -e

        # Create venv directory
        VENV_DIR="${RUNNER_TEMP:-/tmp}/ci-venv"
        echo "Creating virtual environment at $VENV_DIR"
        python3 -m venv "$VENV_DIR"

        # Activate and verify
        source "$VENV_DIR/bin/activate"
        echo "✓ venv created and activated"
        python --version
        which python

        # Upgrade pip
        echo "Upgrading pip..."
        python -m pip install --upgrade pip --quiet

        # Export venv path for subsequent steps
        echo "VENV_PATH=$VENV_DIR" >> $GITHUB_ENV
        echo "$VENV_DIR/bin" >> $GITHUB_PATH

    - name: Install dependencies
      shell: bash
      run: |
        set -e

        # Activate venv
        source "${{ env.VENV_PATH }}/bin/activate"

        # Install package with dev dependencies
        echo "Installing infra-core with dev dependencies..."
        pip install -e ".[dev]" --quiet

        echo "✓ Dependencies installed"
        pip list | grep -E "(infra-core|pytest|ruff|mypy)" || true
