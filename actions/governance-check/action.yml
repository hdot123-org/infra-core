name: 'Governance Check'
description: '检查 PR 作者是否有权修改受保护路径（fail-closed，路径感知）'
inputs:
  owner-login:
    description: '允许的 owner GitHub login'
    required: true
    default: 'hdot123'
  protected-patterns:
    description: '受保护的路径模式（逗号分隔，fnmatch 语法）'
    required: true
    default: '.evolution/**,.github/workflows/**,src/infra_core/engine/**,webhook-scripts/**'
  github-token:
    description: 'GitHub token（用于拉取 PR 变更文件列表）'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Check governance
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        REPO: ${{ github.repository }}
        OWNER_LOGIN: ${{ inputs.owner-login }}
        PROTECTED_PATTERNS: ${{ inputs.protected-patterns }}
      run: |
        set -euo pipefail
        # 拉取 PR 变更文件列表（含 rename 前路径），fail-closed：
        # API 失败即退出非零，绝不静默放行
        ERR_BUF=$(mktemp)
        if ! CHANGED=$(gh api --method GET "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --paginate \
          --jq '.[] | .filename, (.previous_filename // empty)' 2>"$ERR_BUF"); then
          echo "ERROR: 无法获取 PR 变更文件列表（fail-closed 拒绝）：" >&2
          cat "$ERR_BUF" >&2
          rm -f "$ERR_BUF"
          exit 1
        fi
        rm -f "$ERR_BUF"

        # 逐行送入治理判定脚本（随 action 分发，base 上已存在）
        echo "$CHANGED" | python3 "$GITHUB_ACTION_PATH/governance_check.py" \
          --author "$PR_AUTHOR" \
          --owner "$OWNER_LOGIN" \
          --patterns "$PROTECTED_PATTERNS" \
          --files-from -
