# HOTFIX (M2): Triggers disabled — workflow_dispatch only.
# M2 scrutiny: scripts/ paths do not exist (engine in src/infra_core/engine).
# Scheduled cron 0 */2 caused persistent red ticks.
# M4 will rewrite as formal reusable/caller form.

name: Evolution Heartbeat

on:
  workflow_dispatch: {}

concurrency:
  group: evolution-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: [self-hosted, pve-linux]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Create per-run venv (isolation from runner site-packages)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install package
        run: pip install -e .
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          # INFRA-601: 显式仓库上下文，免疫 runner insteadOf 镜像重写
          gh --repo "$GITHUB_REPOSITORY" label create "evolution-heartbeat" --color D93F0B --description "Evolution heartbeat alert" --force || true
      - name: Run heartbeat check
        run: python scripts/evolution_heartbeat.py
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PYTHONSAFEPATH: '1'
