# Test configuration for infra-core engine tests
# Merged with audit tool entries required by scanner test assertions.
max_issues_per_tick: 5
max_self_audit_issues_per_tick: 3
max_code_hygiene_issues_per_tick: 2
severity_order: [critical, warning, info]
dedup_label: "evolution-found"
failure_label: "evolution-isolated"
isolation_threshold: 3
audit_tools:
  - name: daily_kb_audit
    command: "memory-audit-daily --json --no-infra"
    output_format: json
  - name: consistency_check
    command: "memory-consistency-check --json"
    output_format: json
  - name: error_patterns
    # registry generated by CI step 'Generate error patterns' (memory-error-patterns --all-projects)
    output_format: registry_jsonl
    source_file: "memory/kb/patterns/registry.jsonl"
  - name: audit_layout
    command: "memory-audit-layout --target . --json"
    output_format: json
  - name: validate_project
    command: "memory-validate --target . --json"
    output_format: json
  - name: evolution_self_audit
    command: "memory-evolution-audit --json"
    output_format: json
  - name: code_hygiene_audit
    command: "memory-code-hygiene-audit --target . --json"
    output_format: json
    timeout: 300
snapshot_limit: 100
