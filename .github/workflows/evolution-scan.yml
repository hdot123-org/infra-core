# Evolution Scanner reusable workflow（M4 抽离，architecture.md §6）
# scan 主体在本 reusable；schedule/workflow_dispatch 触发面与命名契约留在
# 消费仓 thin caller（per-repo 定时，本期不中央化；caller 文件名必须保留
# evolution-scan.yml——heartbeat 按 gh run list --workflow 文件名解析）。
#
# CRITICAL TOKEN STRATEGY:
# 本 workflow 必须用 DISPATCH_TOKEN（PAT），不能用 GITHUB_TOKEN。
# 原因：DISPATCH_TOKEN 属 @hdot123（OWNER），创建的 Issue author=hdot123，
# 满足 CODEOWNERS 与 governance 检查。触发链：
#   GitHub Issue (DISPATCH_TOKEN) → Linear 同步 → n8n → trigger-droid.sh
#   → droid exec --tag linear-gateway → PR → CI → 合并
#
# 引擎来源：消费仓 `pip install -e .` 连带安装其 pyproject 锁定的
# infra-core tag，scanner/heartbeat 以 `python -m infra_core.engine.*` 运行
# （单一依赖方向 memory-core → infra-core，版本由消费仓 pin 决定）。

name: Evolution Scan Reusable

on:
  workflow_call:
    secrets:
      dispatch-token:
        required: true
        description: PAT (hdot123) for issue/label writes and self-heal dispatch
      linear-api-key:
        required: false
        description: LINEAR_API_KEY for auto_close_resolved Linear state verification
  workflow_dispatch: {}

concurrency:
  group: evolution-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, pve-linux]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Create per-run venv (isolation from runner site-packages)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install package
        run: pip install -e .
      - name: Generate error patterns
        run: infra-error-patterns --all-projects
      - name: Validate registry.jsonl exists
        run: |
          if [ ! -f "memory/kb/patterns/registry.jsonl" ]; then
            echo "::warning::memory/kb/patterns/registry.jsonl not found - error_patterns adapter will have no input"
          else
            echo "✓ registry.jsonl exists"
          fi
      - name: Cache evolution history
        uses: actions/cache@v6
        with:
          path: |
            .evolution/findings_over_time.json
            .evolution/heartbeat.json
          key: evolution-history-${{ github.run_id }}
          restore-keys: evolution-history-
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.dispatch-token }}
        run: |
          # INFRA-601: 显式仓库上下文，免疫 runner insteadOf 镜像重写
          gh --repo "$GITHUB_REPOSITORY" label create "evolution-found" --color FBCA04 --description "Evolution scanner finding" --force || true
          gh --repo "$GITHUB_REPOSITORY" label create "evolution-isolated" --color B60205 --description "Stuck 3+ ticks" --force || true
      - name: Run evolution scanner
        run: python -m infra_core.engine.evolution_scanner
        env:
          GH_TOKEN: ${{ secrets.dispatch-token }}
          # LINEAR_API_KEY enables Linear issue state verification in auto_close_resolved.
          # Without it, the scanner cannot verify Linear terminal state and will
          # fail-closed (block close) for Linear-linked issues to prevent churn.
          LINEAR_API_KEY: ${{ secrets.linear-api-key }}
          # P1-A: Prevent module poisoning — blocks automatic insertion of scripts/ into sys.path.
          # The scanner explicitly re-adds its own directory via sys.path.insert.
          PYTHONSAFEPATH: '1'
