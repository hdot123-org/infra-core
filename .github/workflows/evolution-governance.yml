name: Evolution Governance

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.evolution/**'
      - '.github/workflows/**'
      - 'src/infra_core/engine/**'
      - 'webhook-scripts/**'
      - 'actions/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Block non-owner governance modifications
    runs-on: [self-hosted, pve-linux]
    steps:
      - name: Governance check
        uses: hdot123-org/infra-core/actions/governance-check@v0.7.2
        with:
          owner-login: hdot123
          github-token: ${{ secrets.GITHUB_TOKEN }}
