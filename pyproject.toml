[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-core"
version = "0.2.0"
description = "组织级演进引擎：自进化/审计/门禁体系的共享基础设施"
readme = "README.md"
license = {text = "MIT"}
requires-python = "==3.12.*"
authors = [
    {name = "hdot123", email = "hdot123@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31.0",
]

[project.scripts]
infra-cli = "infra_core.cli:main"
infra-self-audit = "infra_core.engine.evolution_self_audit:main"
infra-hygiene-audit = "infra_core.packs.memory.hygiene:main"
infra-error-patterns = "infra_core.packs.memory.error_patterns:main"
infra-daily-audit = "infra_core.packs.memory.daily_audit:main"
infra-layout-audit = "infra_core.packs.memory.layout_audit:main"

[project.entry-points."infra_core.packs"]
# Pack discovery mechanism - packs register themselves here
memory = "infra_core.packs.memory"
# Example: memory = "infra_core.packs.memory:MemoryPack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "security: 安全与治理守卫（boundary、governance、pr-ref-consistency、fix-has-test、doc-classification）",
    "schema: Schema 与版本同步测试（version_sync、naming_contract）",
    "integration: 集成测试（CLI 入口、跨模块交互、drift_watch、suppression、tick_budget）",
    "e2e: 端到端测试（scanner 全流程、heartbeat、webhook_anchor、CLI 冒烟）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Transplanted engine code preserves original line lengths and import order from memory-core
"src/infra_core/engine/**/*.py" = ["E501", "E402"]
# Transplanted memory pack tools preserve original line lengths from memory-core
"src/infra_core/packs/memory/*.py" = ["E501"]
"tests/**/*.py" = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Ignore missing imports for bare imports added via sys.path manipulation
# (engine modules use bare imports for historical reasons from memory-core transplant)
[[tool.mypy.overrides]]
module = [
    "evolution_adapters",
    "evolution_utils",
]
ignore_missing_imports = true

# deptry: dependency completeness check
# DEP001 exemptions: internal modules imported via sys.path manipulation
#   (engine modules use bare imports for historical reasons from memory-core transplant;
#    guard_cli is a scripts/ local module imported via sys.path)
# DEP002 exemptions: dev-only tools not imported in production code
# DEP003 exemptions: transitive deps used directly (acceptable for now)
[tool.deptry]
ignore = ["DEP002"]

[tool.deptry.per_rule_ignores]
DEP001 = [
    "guard_cli",
    "evolution_scanner",
    "evolution_utils",
    "evolution_adapters",
    "evolution_heartbeat",
    "evolution_self_audit",
    "anchor_gate",
    "extract_anchor",
]
DEP003 = ["packaging", "tomli"]

# Coverage ramp-up plan (orchestrator ruling 2026-08-27):
# Current baseline: 46% (step2-wiring snapshot)
# Threshold: 45% (enforced by --cov-fail-under=45 in CI)
# Ramp-up: +5% per release
# Target: 80% (sustainable quality floor)
#
# Enforcement: pytest --cov-fail-under=45 in ci.yml
# Progress tracking: update this comment and the threshold each release
