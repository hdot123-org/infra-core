# Test configuration for infra-core engine tests
# Merged with audit tool entries required by scanner test assertions.
max_issues_per_tick: 5
max_self_audit_issues_per_tick: 3
max_code_hygiene_issues_per_tick: 2
severity_order: [critical, warning, info]
dedup_label: "evolution-found"
failure_label: "evolution-isolated"
isolation_threshold: 3
# INFRA-647（对齐 memory-core m6-harden 同款迁移）：error_patterns 曾以
# registry_jsonl inline override 保住 dogfood 扫描连续性（infra v0.5.1 引擎
# run_audit_tool 不支持 jsonl stdout）——引擎补 jsonl 逐行解析分支（#80，
# v0.6.1 起本仓原生内置）后移除 override，回归 memory pack 模板原生 jsonl
# 路径（infra-error-patterns --repo-root {repo_root} --json）。
# 契约测试：tests/test_evolution_config_contract.py。
# 注意：本文件其余 memory-* inline 条目引用 memory-core 协议栈 CLI，仅在
# 消费仓（如 memory-core）扫描时有意义；rule_packs 展开的 infra-* 入口
# 才是本仓 dogfood 扫描的实际执行体。
rule_packs:
  - pack: memory
audit_tools:
  - name: daily_kb_audit
    command: "memory-audit-daily --json --no-infra"
    output_format: json
  - name: consistency_check
    command: "memory-consistency-check --json"
    output_format: json
  - name: audit_layout
    command: "memory-audit-layout --target . --json"
    output_format: json
  - name: validate_project
    command: "memory-validate --target . --json"
    output_format: json
  - name: evolution_self_audit
    command: "memory-evolution-audit --json"
    output_format: json
  - name: code_hygiene_audit
    command: "memory-code-hygiene-audit --target . --json"
    output_format: json
    timeout: 300
snapshot_limit: 100
