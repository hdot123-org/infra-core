name: 'Governance Check'
description: '检查 PR 作者是否有权修改受保护路径'
inputs:
  owner-login:
    description: '允许的 owner GitHub login'
    required: true
    default: 'hdot123'
  protected-patterns:
    description: '受保护的路径模式（逗号分隔）'
    required: true
    default: '.evolution/**,.github/workflows/**,src/infra_core/engine/**,webhook-scripts/**'
runs:
  using: 'composite'
  steps:
    - name: Check owner
      shell: bash
      run: |
        OWNER_LOGIN="${{ inputs.owner-login }}"
        PR_AUTHOR="${{ github.event.pull_request.user.login }}"
        
        if [[ "$PR_AUTHOR" != "$OWNER_LOGIN" ]]; then
          echo "❌ 拒绝：只有 $OWNER_LOGIN 可以修改受保护路径"
          echo "PR 作者：$PR_AUTHOR"
          echo "受保护模式：${{ inputs.protected-patterns }}"
          exit 1
        fi
        
        echo "✓ 作者是 $OWNER_LOGIN，允许修改受保护路径"
