self-hosted-runner:
  # 自建 runner label，actionlint 内置清单不认识，需显式声明：
  # - pve-linux: org 级 Linux runner（pve-runner-01 / pve-runner-02，全部 CI job）
  # - memory-core-upgrade: org 级 Mac runner（memory-core-mac，发版 upgrade-consumer 专属）
  labels:
    - pve-linux
    - memory-core-upgrade

paths:
  .github/workflows/evolution-scan.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'  # rhysd/actionlint#647
  .github/workflows/evolution-heartbeat.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'  # rhysd/actionlint#647
