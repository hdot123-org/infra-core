# 引擎仓自扫配置（INFRA-659）。
# 旧版是 memory-core 复制来的测试配置，引用 memory-* 命令——infra-core venv
# 只安装 infra-* 入口（pyproject [project.scripts]），自扫 workflow_dispatch
# 每次以 "No such file or directory: 'memory-audit-daily'" 全工具失败退出。
# 现改为 rule_packs 展开的 infra-* 工具集 + inline override：
#   - error_patterns：引擎仓 CI 无宿主 ~/.memory-core 输入源，且 pack 模板
#     --repo-root 会在仓库根创建 memory/kb/patterns/（公开仓 gitignore 该树），
#     凭空制造 CURRENT_MEMORY 误报——禁用。
#   - evolution_self_audit：检查对象是消费仓管线（memory 仓 issue 同步、
#     宿主 ~/.factory 设施），引擎仓 CI 无对应对象，且其 check_config_yml
#     断言 audit_tools >= 6 与 pack 化配置结构性不符——禁用。
#   - daily_kb_audit / consistency_check / validate_project：memory 协议栈
#     工具，属消费仓（memory-core）所有，引擎仓自扫不含——禁用。
# 生效工具：audit_layout（布局误报由 suppress.json 精确抑制，INFRA-659）
# 与 code_hygiene_audit（代码卫生，对象是本仓源码）。
max_issues_per_tick: 5
max_self_audit_issues_per_tick: 3
max_code_hygiene_issues_per_tick: 2
severity_order: [critical, warning, info]
dedup_label: "evolution-found"
failure_label: "evolution-isolated"
isolation_threshold: 3
rule_packs:
  - pack: memory
audit_tools:
  - name: daily_kb_audit
    pack_tool: daily_kb_audit
    enabled: false
  - name: error_patterns
    pack_tool: error_patterns
    enabled: false
  - name: evolution_self_audit
    pack_tool: evolution_self_audit
    enabled: false
  - name: consistency_check
    command: "memory-consistency-check --json"
    output_format: json
    enabled: false
  - name: validate_project
    command: "memory-validate --target . --json"
    output_format: json
    enabled: false
snapshot_limit: 100
