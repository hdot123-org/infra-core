# Droid Review Shards — reusable shard pipeline (M4 门禁切换，TD-DR-01)
#
# 被 memory-core 等 droid-review thin caller 调用，承接原 3-job 流水线中的
# setup / plan-shards / review-shard 三个 job。聚合发布（check 名 `droid-review`
# 的 job）**不在本文件**——reusable workflow 内部 job 的 check 名会变成
# `外层/内层` 嵌套格式，精确名契约必须由 caller 本地 job 跑 composite action
# （hdot123-org/infra-core/actions/droid-review-aggregate）保持。
#
# 三个契约（本文件承载其中两个，NEVER break）：
#   1. Workflow 名 "Droid Auto Review"（caller 侧，本文件只承接分片流水线）
#   2. Artifact 前缀 "droid-review-debug-"（watchdog quota-sweep 依赖，本文件上传）
#   3. 聚合 job key `droid-review`（caller 本地 job，绝不进本文件）
#
# 与 infra-core 自仓 droid-review.yml 的差异（reusable 化适配，行为等价）：
#   - 预算参数（SHARD_MAX_* / SHARD_TIMEOUT_MINUTES）由 caller 以 inputs 转发
#     （vars context 在 caller 文件引用，显式传递避免隐式依赖）
#   - 引擎脚本（plan_shards.py / run_shard.sh）checkout 自本仓
#     src/infra_core/engine/droid_review/（engine_ref 输入，默认 main），
#     不依赖消费仓本地 scripts/droid_review/ 副本（消除副本同步债）
#   - 不引用仓库本地 venv composite（消费仓没有该文件；分片流水线
#     仅依赖 python3 stdlib + jq + gh + droid CLI，无需 venv）
#   - workspace guard 的残缺探针用 pyproject.toml（消费仓共有文件，避免
#     用本仓特有路径做探针导致每 run 全量重克隆）
#   - BYOM 走 ts 内网直达 Kong（与自仓 workflow 一致，test_droid_review_byom_tailnet 钉住）

name: Droid Review Shards

# 禁止顶层 concurrency（INFRA-626）：reusable 携带顶层 concurrency 会与 caller
# 顶层组名组合触发 GitHub run 级自死锁检测（evolution 系 #1071 首 tick 实测，
# caller 'evolution-scan' × callee 同名组 → 零 job 秒取消）。per-repo 串行化/
# 去重归 caller 顶层 concurrency。通用禁令由 test_naming_contract.py
# TestReusableNoTopLevelConcurrency 对全部 workflow_call 文件锁定。
#
# 历史注（编排器注 2026-08-29，随 INFRA-626 移除）：本文件曾带
# dr-${{ inputs.head_sha || github.event.pull_request.head.sha || github.run_id }}
# 做 caller 级同 head 去重（PR #61 实测同 head 3 条并行 run）——迁移理由：被调
# workflow 的顶层 concurrency 在 caller 组名不同时同样生效，跨仓同名 caller
# 组合一撞即死锁；同 head 去重若消费仓需要，应在 caller 顶层 group 中按
# head SHA 表达（caller 侧模板测试锁定），reusable 侧一律不携带。

on:
  workflow_call:
    # 双形态键声明（CONSUMER-GATE-DEADLOCK 修复 2026-08-30）：GitHub 对 caller
    # with: 传键做声明面严格校验——caller 传了未声明键 → run 级 startup_failure
    # （零 job）。memory #1075 双写 caller（snake + hyphen 并传）× 本文件单侧
    # snake-only 声明即 04:08Z Droid Auto Review 断链根因。每个 snake 键带一个
    # hyphen 变体（required: false，default 空），取值处统一熔合
    # `inputs.x_snake || inputs['x-hyphen']`（bracket 语法——hyphen 键不允许
    # 点号取值）。两步终态：memory 统一 snake-only 后本仓删全部 hyphen 变体。
    inputs:
      engine_ref:
        description: 'infra-core ref for engine scripts (plan_shards.py / run_shard.sh)'
        required: false
        type: string
        default: 'main'
      engine-ref:
        description: 'hyphen 过渡变体（与 engine_ref 等价）'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'PR number (workflow_dispatch passthrough; empty for pull_request_target)'
        required: false
        type: string
        default: ''
      pr-number:
        description: 'hyphen 过渡变体（与 pr_number 等价）'
        required: false
        type: string
        default: ''
      head_sha:
        description: 'Head SHA override (workflow_dispatch passthrough)'
        required: false
        type: string
        default: ''
      head-sha:
        description: 'hyphen 过渡变体（与 head_sha 等价）'
        required: false
        type: string
        default: ''
      shard_max_files:
        description: 'Layer 3: shard size cap in files (caller 转发 vars.SHARD_MAX_FILES)'
        required: false
        type: string
        default: '25'
      shard-max-files:
        description: 'hyphen 过渡变体（与 shard_max_files 等价）'
        required: false
        type: string
        default: ''
      shard_max_count:
        description: 'Layer 3: shard count cap (caller 转发 vars.SHARD_MAX_COUNT)'
        required: false
        type: string
        default: '6'
      shard-max-count:
        description: 'hyphen 过渡变体（与 shard_max_count 等价）'
        required: false
        type: string
        default: ''
      shard_timeout_minutes:
        description: 'Layer 1: shard job timeout in minutes (caller 转发 vars.SHARD_TIMEOUT_MINUTES)'
        required: false
        type: string
        default: '45'
      shard-timeout-minutes:
        description: 'hyphen 过渡变体（与 shard_timeout_minutes 等价）'
        required: false
        type: string
        default: ''
      shard_max_parallel:
        description: 'Layer 4: matrix concurrency cap (caller 转发 vars.SHARD_MAX_PARALLEL)'
        required: false
        type: string
        default: '3'
      shard-max-parallel:
        description: 'hyphen 过渡变体（与 shard_max_parallel 等价）'
        required: false
        type: string
        default: ''
    outputs:
      pr_number:
        description: 'Resolved PR number'
        value: ${{ jobs.setup.outputs.pr_number }}
      base_sha:
        description: 'PR base SHA'
        value: ${{ jobs.setup.outputs.base_sha }}
      head_sha:
        description: 'PR head SHA'
        value: ${{ jobs.setup.outputs.head_sha }}
      docs_only:
        description: 'true 当 PR 只改 *.md（skip 模型 review）'
        value: ${{ jobs.plan-shards.outputs.docs_only }}
      shards:
        description: '分片计划 JSON 数组（docs-only 或空计划时为 [] / 空）'
        value: ${{ jobs.plan-shards.outputs.shards }}
      plan_shards_ok:
        description: "plan-shards job 是否 success（caller 聚合 job 的 if 门；skipped/failure → 空，保持 `needs.plan-shards.result == 'success'` 语义）"
        value: ${{ jobs.plan-shards.outputs.plan_ok }}
    secrets:
      FACTORY_API_KEY:
        description: 'Factory API key（droid exec 凭证）'
        required: true
      NVIDIA_KONG_PROXY_KEY:
        description: 'Kong proxy key（BYOM provider 格式占位；内网 Kong 无认证，保留注入面）'
        required: false

# F4/INFRA-688: 显式最小权限基线——三个 job 均已带 job 级声明；顶层基线兜底
# 未来新增 job 忘记声明时回落到只读（而非仓库默认权限）。
permissions:
  contents: read

jobs:
  # ── Job 0: Setup - resolve PR context for both caller trigger types ──
  # github context 关联 caller 事件：pull_request_target / workflow_dispatch 原样可用
  setup:
    permissions:
      contents: read
    runs-on: [self-hosted, pve-linux]
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      draft: ${{ steps.resolve.outputs.draft }}
      user_login: ${{ steps.resolve.outputs.user_login }}
    steps:
      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # pull_request_target trigger: use event context
            {
              echo "pr_number=${{ github.event.pull_request.number }}"
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "user_login=${{ github.event.pull_request.user.login }}"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from pull_request_target event"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch trigger: fetch PR data via API
            PR_NUMBER="${{ inputs.pr_number || inputs['pr-number'] }}"
            echo "Fetching PR #$PR_NUMBER data via API..."

            PR_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            BASE_SHA=$(echo "$PR_DATA" | jq -r '.base.sha')
            HEAD_SHA="${{ inputs.head_sha || inputs['head-sha'] }}"
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
              HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            fi
            DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
            USER_LOGIN=$(echo "$PR_DATA" | jq -r '.user.login')

            {
              echo "pr_number=$PR_NUMBER"
              echo "base_sha=$BASE_SHA"
              echo "head_sha=$HEAD_SHA"
              echo "draft=$DRAFT"
              echo "user_login=$USER_LOGIN"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from workflow_dispatch (PR #$PR_NUMBER, head=$HEAD_SHA)"
          else
            echo "::error::Unsupported event name: ${{ github.event_name }}"
            exit 1
          fi

  # ── Job 1: Plan shards (no model call, ~1min) ──
  plan-shards:
    needs: setup
    if: needs.setup.outputs.draft == 'false' && needs.setup.outputs.user_login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      docs_only: ${{ steps.docs_only.outputs.skip }}
      plan_ok: ${{ steps.plan_gate.outputs.plan_ok }}
    steps:
      - name: Workspace guard (sparse residue detox)
        run: |
          set -euo pipefail
          # 2026-08-28 污染事故运行时排毒：共享持久 _work 工作区的 sparse 残留
          # 使 checkout 无法恢复被裁剪的工作树。reusable 版探针用 pyproject.toml
          # （两仓及一般消费仓共有；用本仓特有路径做探针会造成消费仓
          # 每 run 全量重克隆）。
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -f "$GITHUB_WORKSPACE/pyproject.toml" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - name: Checkout engine (infra-core)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hdot123-org/infra-core
          ref: ${{ inputs.engine_ref || inputs['engine-ref'] }}
          fetch-depth: 1
          path: engine

      - name: Detect docs-only PR
        id: docs_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Detecting whether PR #$PR_NUMBER changes only docs files (*.md)..."
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "File list empty or API failure — fail-closed, run full review"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_MD=$(echo "$FILES" | grep -v '\.md$' || true)
          if [ -z "$NON_MD" ]; then
            echo "docs-only=true — all changed files are *.md, skipping model review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false — non-md files present:"
            echo "$NON_MD"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan shards
        id: plan
        if: steps.docs_only.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          MAX_FILES: ${{ inputs.shard_max_files || inputs['shard-max-files'] }}
          MAX_COUNT: ${{ inputs.shard_max_count || inputs['shard-max-count'] }}
        run: |
          set -euo pipefail
          # Get changed files from PR (with status for deleted-file handling)
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | .filename + "\t" + .status' > changed_files_with_status.txt
          # Extract just filenames for planner
          cut -f1 changed_files_with_status.txt > changed_files.txt
          # Filter out docs-only files
          grep -v '\.md$' changed_files.txt > code_files.txt || true
          # Run planner（引擎副本；CWD 为消费仓工作区，文件清单落在此处）
          if [ -s code_files.txt ]; then
            PLAN=$(python3 engine/src/infra_core/engine/droid_review/plan_shards.py "$MAX_FILES" "$MAX_COUNT" < code_files.txt)
            echo "Plan output: $PLAN"
            echo "shards=$(echo "$PLAN" | jq -c '.shards')" >> "$GITHUB_OUTPUT"
          else
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          fi
          # Save file statuses for shard scripts (deleted files need special handling)
          cp changed_files_with_status.txt /tmp/file_statuses.txt

      - name: Upload file statuses
        if: always() && steps.docs_only.outputs.skip != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: file-statuses-${{ github.run_id }}
          path: /tmp/file_statuses.txt
          retention-days: 1

      - name: Mark plan gate ok
        # 末步置位（无 if，正常完成才执行）：job skipped/failure 时该输出为空，
        # caller 以 plan_shards_ok == 'true' 判定，等价旧 `needs.plan-shards.result == 'success'`
        id: plan_gate
        run: echo "plan_ok=true" >> "$GITHUB_OUTPUT"

  # ── Job 2: Review shard matrix (parallel, model call) ──
  review-shard:
    needs: [setup, plan-shards]
    if: >-
      needs.plan-shards.outputs.docs_only != 'true' &&
      needs.plan-shards.outputs.shards != '[]' &&
      needs.plan-shards.outputs.shards != ''
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: ${{ fromJSON(inputs.shard_timeout_minutes || inputs['shard-timeout-minutes']) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.shard_max_parallel || inputs['shard-max-parallel']) }}
      matrix:
        shard: ${{ fromJSON(needs.plan-shards.outputs.shards) }}
    env:
      NVIDIA_KONG_PROXY_KEY: ${{ secrets.NVIDIA_KONG_PROXY_KEY }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Workspace guard (sparse residue detox)
        run: |
          set -euo pipefail
          # 2026-08-28 污染事故运行时排毒（探针同 plan-shards：pyproject.toml）
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -f "$GITHUB_WORKSPACE/pyproject.toml" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - name: Checkout repository (BASE)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.setup.outputs.base_sha }}
          fetch-depth: 0

      - name: Checkout PR head (HEAD → head-src/)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.setup.outputs.head_sha }}
          fetch-depth: 0
          path: head-src

      - name: Checkout engine (infra-core)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hdot123-org/infra-core
          ref: ${{ inputs.engine_ref || inputs['engine-ref'] }}
          fetch-depth: 1
          path: engine

      - name: Set shard environment
        id: shard_env
        env:
          SHARD_FILE_JSON: ${{ toJson(matrix.shard.files) }}
          SHARD_ID_VAL: ${{ matrix.shard.shard_id }}
          BASE_SHA: ${{ needs.setup.outputs.base_sha }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
        run: |
          set -euo pipefail

          # (A) Fix: Use GITHUB_ENV multi-line delimiter for SHARD_FILES.
          # The runner reads the literal value between delimiters — no quote
          # stripping. Previous version used echo "SHARD_FILES='$JSON'" which
          # embedded literal single quotes into the env var, breaking jq.
          {
            echo "SHARD_ID=$SHARD_ID_VAL"
            echo "BASE_REF=$BASE_SHA"
            echo "HEAD_REF=$HEAD_SHA"
            echo "RUN_ID=${{ github.run_id }}"
            printf 'SHARD_FILES<<EOF_SHARD\n%s\nEOF_SHARD\n' "$SHARD_FILE_JSON"
          } >> "$GITHUB_ENV"

          # Compute merge-base within head-src after fetching base SHA
          cd head-src
          git config --global --add safe.directory "$GITHUB_WORKSPACE/head-src"

          # Fetch the base SHA explicitly so merge-base can resolve it
          # NOTE: Do NOT use --depth=1 here! Shallow fetch writes the base SHA
          # into .git/shallow, causing merge-base to return empty when the base
          # branch has advanced past the PR's fork point. This would fail-close
          # every PR where base moved forward. Full fetch is required.
          git fetch origin "$BASE_SHA" || {
            echo "::error::Failed to fetch base SHA $BASE_SHA"
            exit 1
          }

          # Compute merge-base — fail-closed (no || true)
          MERGE_BASE=$(git merge-base HEAD "$BASE_SHA")
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::Failed to compute merge-base between HEAD and $BASE_SHA"
            exit 1
          fi
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
          echo "Merge base: $MERGE_BASE"
          cd "$GITHUB_WORKSPACE"

      - name: Install Droid CLI
        run: |
          set -euo pipefail
          # 宿主优先（照抄 actionlint host-first 模式，PR #53）：ce-01 五台 pve
          # runner 已预装 /usr/local/bin/droid（Layer 1 离线化）。背景：Factory CLI
          # 下载脚本是 node-00 出口拓扑下最后一条非镜像下载路径——PR #52
          # review-shard 被 runner shutdown 杀死在下载中、PR #61 首轮同因红
          # （rerun 自愈）。PATH 命中且版本 ≥0.200 直接使用，零外网下载；宿主
          # 缺失/过旧时 fallback 原 curl 下载路径（GitHub-hosted 兼容）并打 ::warning。
          HOST_OK=0
          if command -v droid >/dev/null 2>&1; then
            HOST_VERSION="$(droid --version 2>/dev/null | head -1 | grep -oE '[0-9]+(\.[0-9]+)*' | head -1)" || true
            HOST_MAJOR="${HOST_VERSION%%.*}"
            HOST_MINOR="${HOST_VERSION#*.}"
            HOST_MINOR="${HOST_MINOR%%.*}"
            if [ "${HOST_MAJOR:-0}" -gt 0 ] || { [ "${HOST_MAJOR:-0}" -eq 0 ] && [ "${HOST_MINOR:-0}" -ge 200 ]; }; then
              echo "✓ Using host droid CLI: $(command -v droid) ($(droid --version 2>/dev/null | head -1))"
              HOST_OK=1
            else
              echo "::warning::host droid ${HOST_VERSION:-unknown} < 0.200, falling back to download"
            fi
          else
            echo "::warning::droid not found on host, falling back to download"
          fi
          if [ "$HOST_OK" -eq 1 ]; then
            droid --version
          else
            # --max-time 300：INFRA-613 运维插曲——pve-runner-06 两次 Install
            # Droid CLI 45min 挂死（rerun 沿用旧定义快照走 fallback 下载，curl
            # 无总超时直落到 runner shutdown）。retry 只管连接级，管不住传输出
            # 半吊子后停摆；max-time 兜底整条命令，配合 --retry 在 5×300s 窗口
            # 内自救，仍失败则快速红灯而非挂死。
            curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 300 -fsSL https://app.factory.ai/cli | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            # GITHUB_PATH 对本步不生效，就地自检走全路径（后续步骤已含 ~/.local/bin）
            "$HOME/.local/bin/droid" --version
          fi

      - name: Write BYOM settings file
        # LLM 链路：ts 内网直达 Kong（tailscale serve, tailnet only, LE 证书）。
        # 原 https://ai.exa.edu.kg/v1 需经 CF → node-22(东京) → 隧道回 node-01，
        # 4 段网络且暴露公网端点；github 可达性已由 CF Worker 反代解决后，
        # 境外跳板失去必要性（Bailian 是国内服务，杭州 Kong 出网即最短路径）。
        # 前置依赖：runner 机 /etc/hosts 有 node1.tail5e888.ts.net 静态条目
        # （runner 的 tailscale accept-dns=false，MagicDNS 不可用）。
        # apiKey 字段仅为 provider 格式占位——内网 Kong 无认证（request-transformer
        # 会注入真实上游 key），且 heredoc 为单引号模式，变量从不展开。
        run: |
          set -euo pipefail
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'SETTINGS_EOF'
          {
            "customModels": [
              {
                "model": "qwen3.7-plus",
                "displayName": "Bailian Qwen 3.7 Plus",
                "baseUrl": "https://node1.tail5e888.ts.net/v1",
                "apiKey": "${NVIDIA_KONG_PROXY_KEY}",
                "provider": "generic-chat-completion-api",
                "maxOutputTokens": 65536,
                "noImageSupport": true
              }
            ]
          }
          SETTINGS_EOF
          echo "BYOM settings written to ~/.factory/settings.json"
          python3 -c "import json; json.load(open('$HOME/.factory/settings.json')); print('JSON validation passed')"

      - name: Pre-check credentials
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Verifying Factory API credentials before review..."
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::FACTORY_API_KEY secret is empty or not configured."
            exit 1
          fi
          echo "Secret is present (length: ${#FACTORY_API_KEY} chars)."

      - name: Run shard review
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 引擎副本（engine checkout）；CWD 保持消费仓 BASE 工作区：
          # run_shard.sh 从 CWD 读取 .github/review/shard-review-prompt.md、
          # head-src/ diff 上下文，并把 findings 写到工作区根目录。
          # schema 校验的 validate_findings 由脚本自身目录解析（引擎自包含）。
          bash engine/src/infra_core/engine/droid_review/run_shard.sh

      - name: Collect debug transcripts
        if: always()
        run: |
          set -euo pipefail
          # upload-artifact v4 rejects hidden directories (.factory/).
          # Copy Factory session transcripts into the workspace as .factory/sessions/
          # so the watchdog's quota-sweep grep can find them in the artifact.
          # Also collect run_shard.sh execution logs for diagnosing droid exec failures.
          mkdir -p .factory/sessions
          if [ -d "$HOME/.factory/sessions" ]; then
            echo "Copying session transcripts from $HOME/.factory/sessions/"
            if [ -n "$(ls -A "$HOME/.factory/sessions" 2>/dev/null)" ]; then
              cp -r "$HOME/.factory/sessions/"* .factory/sessions/ 2>/dev/null || \
                echo "Warning: Failed to copy some session files"
            else
              echo "Warning: $HOME/.factory/sessions is empty, no transcripts to upload"
            fi
          else
            echo "Warning: $HOME/.factory/sessions does not exist, no transcripts to upload"
          fi
          # shard-exec-error.log and droid-exec-stdout.json are written by
          # run_shard.sh in the workspace root — upload-artifact will pick them
          # up directly (no copy needed).

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: droid-review-debug-${{ github.run_id }}-shard-${{ matrix.shard.shard_id }}
          include-hidden-files: true
          path: |
            findings-shard-*.json
            shard-*.diff
            shard-exec-error.log
            droid-exec-stdout.json
            prompt.md
            shard-env.log
            .factory/sessions/**
          retention-days: 7
