# Droid Autofix — CI 失败自动修复闭环（阶段三最小落地）
#
# 链路：CI 失败（PR 分支）→ 本 workflow（新 runner 上的 droid）→
#   BYOK 模型分析失败日志并最小修复 → 脚本层 commit/push 回原 PR 分支 →
#   CI + droid-review 自动重跑 → auto-merge 管道收尾。
#
# 依据与护栏（2026-09-08 会话裁定与实测）：
# - 计费：仅 BYOK（百炼 coding 端点 + BAILIAN_API_KEY），禁 factory_credits
#   （kb decision: runner-droid-byok-only-ruling）
# - 权限：--auto medium（文件编辑/装包/build/test；不含 git push）——
#   官方最佳实践 "commit/push in scripted steps"，推送一律脚本层完成
# - PR 写操作凭证：DISPATCH_TOKEN（PAT，不受 GITHUB_TOKEN 递归抑制，
#   确保 fix push 能触发新一轮 CI + droid-review）
# - 防死循环：每 PR 最多 2 次自动修复（评论 sentinel 计数，超限交还人工）
# - 串行化：全局 concurrency 单飞，防并发修复互踩与 sentinel 竞态
# - droid exec 无 --timeout 旗标（官方文档核验）→ job 级 timeout-minutes 兜底
# - 提示词注入面：失败日志摘录可能含 PR 作者可控文本，私有仓 + 内部
#   消费者场景风险可控；公开仓复用本模板前需加输入净化
#
# 触发面：
# - workflow_run：CI（workflow 名 "CI"）失败（仅 pull_request 事件触发的 run；
#   main 直推失败不自动修）
# - workflow_dispatch：手动指定 pr_number（演示/补跑入口）

name: Droid Autofix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "待修复的 PR 编号（演示/补跑入口）"
        required: true
        type: string

permissions:
  contents: read
  actions: read   # 步骤 6 gh run view --log-failed 需要（run 34201897176 教训）

concurrency:
  group: droid-autofix
  cancel-in-progress: false

jobs:
  autofix:
    name: Auto-fix failing PR (BYOK)
    # 门禁（Fable 审查 C 项裁定）：自动开火默认关——本仓 PR 全部由活会话持有，
    # 无守卫的自动模式必然与会话竞态（不对称修复风险）。守卫齐备后将仓库变量
    # AUTOFIX_AUTO_ENABLED 置 true 启用；workflow_dispatch（显式派发）不受此门限制。
    # main 直推与非失败结论不进入修复（分支级再兜底一次）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       vars.AUTOFIX_AUTO_ENABLED == 'true' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 关键修复（run 34201897176 根因）：checkout 前的步骤里 gh 会从本地
      # .git 解析仓库名而崩溃（"not a git repository"）；GH_REPO 让全部
      # gh 调用显式定仓，不依赖本地 git
      GH_REPO: ${{ github.repository }}
    steps:
      # ---- 1. 解析 PR 上下文（workflow_run / dispatch 双入口归一） ----
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
            SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            RUN_ID=$(gh run list --branch "$BRANCH" --workflow CI --limit 1 \
              --json databaseId,conclusion --jq '.[] | select(.conclusion == "failure") | .databaseId' | head -1)
            [ -z "$RUN_ID" ] && RUN_ID=$(gh run list --branch "$BRANCH" --workflow CI --limit 1 --json databaseId --jq '.[0].databaseId')
          else
            PR="$WR_PR_NUMBER"
            BRANCH="$WR_BRANCH"
            SHA="$WR_SHA"
            RUN_ID="$WR_RUN_ID"
            if [ -z "$PR" ]; then
              PR=$(gh pr list --head "$BRANCH" --state open --limit 1 --json number --jq '.[0].number' || echo "")
            fi
            if [ -z "$PR" ]; then
              echo "skip: 分支 $BRANCH 无 open PR，不修复"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          STATE=$(gh pr view "$PR" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "skip: PR #$PR 状态 $STATE 非 OPEN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --- ownership 三连守卫（Fable 审查 B-1/B-2，防双执行器抢活与不对称修复）---
          # ① draft = 持有者声明 WIP，autofix 不接管（ready 即放开）
          DRAFT=$(gh pr view "$PR" --json isDraft --jq .isDraft)
          if [ "$DRAFT" = "true" ]; then
            echo "skip: PR #$PR 为 draft（持有会话 WIP 中），autofix 让路"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ② 失败 SHA 之后分支又动过 = 有活跃执行者，让路（无状态、跨仓可移植）
          HEAD_NOW=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$HEAD_NOW" != "$SHA" ]; then
            echo "skip: 分支已从 ${SHA:0:7} 移动到 ${HEAD_NOW:0:7}（有活跃执行者），autofix 让路"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ③ 静默期：最近提交 < 20 分钟 = 高频推送中（仅自动路径；显式 dispatch 视为发起者已确认无并发）
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            LAST_PUSH=$(gh pr view "$PR" --json commits --jq '.commits[-1].committedDate')
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_PUSH" +%s) ))
            if [ "$AGE" -lt 1200 ]; then
              echo "skip: 最近提交距今 ${AGE}s < 20min（活跃开发中），autofix 让路"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # --- 上下文采集（缓解上下文不对称：意图注入，喂给步骤 6 提示词）---
          TITLE=$(gh pr view "$PR" --json title --jq .title)
          BODY_EXCERPT=$(gh pr view "$PR" --json body --jq '.body // ""' | head -c 800)
          RECENT=$(gh pr view "$PR" --json commits \
            --jq '[.commits[-5:][] | .messageHeadline] | join("\n- ")')
          {
            echo "pr=$PR"
            echo "branch=$BRANCH"
            echo "sha=$SHA"
            echo "run_id=$RUN_ID"
            echo "title=$TITLE"
            printf 'recent<<RECENT_EOF\n- %s\nRECENT_EOF\n' "$RECENT" >> "$GITHUB_OUTPUT"
            printf 'body<<BODY_EOF\n%s\nBODY_EOF\n' "$BODY_EXCERPT" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_OUTPUT"
          echo "target: PR #$PR branch=$BRANCH failed_run=$RUN_ID"

      # ---- 2. 仅 notify 失败过滤（WEBHOOK_NOTIFY_STRICT=true 时送达失败使 CI 红，
      #        非代码问题，autofix 不接管。混合失败不误伤，正常修复）----
      - name: Filter notify-only failures
        id: notify_filter
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR: ${{ steps.ctx.outputs.pr }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            echo "no run_id; skipping filter"
            exit 0
          fi
          # 取失败 job 清单（conclusion=failure）
          FAILED_JOBS=$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name]')
          echo "failed jobs: $FAILED_JOBS"
          # 空列表 = 无失败 job（不应到达此处，防御性放行）
          if [ "$FAILED_JOBS" = "[]" ] || [ -z "$FAILED_JOBS" ]; then
            echo "no failed jobs detected; proceeding normally"
            exit 0
          fi
          # 判定：全部失败 job 是否都是 notify
          NON_NOTIFY=$(echo "$FAILED_JOBS" | jq '[.[] | select(. != "Notify CI complete to webhook gateway")] | length')
          TOTAL=$(echo "$FAILED_JOBS" | jq 'length')
          echo "total failed: $TOTAL, non-notify: $NON_NOTIFY"
          if [ "$NON_NOTIFY" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "all failed jobs are notify-only; skipping autofix"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --body "🏗️ 基础设施送达失败（webhook gateway notify），非代码问题，autofix 不接管。

          失败 run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}

          <!-- droid-autofix-notify-skip -->"
          else
            echo "mixed failures (non-notify present); autofix takes over"
          fi

      # ---- 3. 防死循环：sentinel 计数，每 PR 最多 2 次 ----
      - name: Attempt cap guard (max 2 per PR)
        id: cap
        if: steps.ctx.outputs.skip != 'true' && steps.notify_filter.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          set -euo pipefail
          N=$(gh pr view "$PR" --json comments \
            --jq '[.comments[].body | select(contains("<!-- droid-autofix-attempt"))] | length')
          echo "existing autofix attempts on PR #$PR: $N"
          if [ "$N" -ge 2 ]; then
            echo "::notice::PR #$PR 已达自动修复上限（2 次），交还人工处理"
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "attempt=$((N + 1))" >> "$GITHUB_OUTPUT"
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- 3. 检出失败 SHA（不是运行时 tip：修复期间分支可能被持有者推进，
      #          拿旧日志修新代码是正确性缺陷——Fable 审查盲区 3）----
      - name: Checkout PR head
        if: steps.cap.outputs.active == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.ctx.outputs.sha }}
          fetch-depth: 0
          # 关键（run 34206424614 教训）：checkout 默认把 GITHUB_TOKEN 以
          # extraheader 形式持久化进 .git/config，直接覆盖 credential
          # helper → 步骤 8 的 push 以 github-actions[bot] 身份 403。
          # 关闭持久化后，push 走 gh credential helper（DISPATCH_TOKEN PAT）。
          persist-credentials: false

      # ---- 4. 安装 Droid CLI（探测式，与 droid-runner-pilot 同款） ----
      - name: Install Droid CLI
        if: steps.cap.outputs.active == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://app.factory.ai/cli | sh
          if ! command -v droid >/dev/null 2>&1; then
            for dir in "$HOME/.factory/bin" "$HOME/.local/bin" /usr/local/bin; do
              if [ -x "$dir/droid" ]; then
                echo "$dir" >> "$GITHUB_PATH"
                echo "droid found at: $dir/droid"
                break
              fi
            done
          fi
          command -v droid
          droid --version

      # ---- 5. BYOK settings 注入（与 pilot byok job 同构，裁定禁 factory_credits） ----
      - name: Pre-check BYOK secret and write settings
        if: steps.cap.outputs.active == 'true'
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BAILIAN_API_KEY" ]; then
            echo "::error::BAILIAN_API_KEY secret is empty or not configured (repo or org)."
            exit 1
          fi
          mkdir -p "$HOME/.factory"
          jq -n --arg key "$BAILIAN_API_KEY" '{
            customModels: [{
              model: "qwen3.7-plus",
              id: "custom:Bailian-Coding-Autofix",
              baseUrl: "https://coding.dashscope.aliyuncs.com/v1",
              apiKey: $key,
              displayName: "Bailian Coding BYOK Autofix",
              provider: "generic-chat-completion-api",
              noImageSupport: false
            }],
            sessionDefaultSettings: { model: "custom:Bailian-Coding-Autofix" }
          }' > "$HOME/.factory/settings.json"
          jq -e '.customModels[0].apiKey | length > 0' "$HOME/.factory/settings.json" >/dev/null
          echo "BYOK settings written (qwen3.7-plus via coding endpoint)"

      # ---- 6. 失败日志摘录 + 提示词组装（含意图上下文，缓解上下文不对称）----
      - name: Build autofix prompt
        if: steps.cap.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          SHA: ${{ steps.ctx.outputs.sha }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
          PR_TITLE: ${{ steps.ctx.outputs.title }}
          PR_BODY: ${{ steps.ctx.outputs.body }}
          PR_RECENT: ${{ steps.ctx.outputs.recent }}
        run: |
          set -euo pipefail
          # --log-failed 只含失败 job 的日志；截断防提示词爆炸
          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --log-failed 2>/dev/null | head -c 12000 > /tmp/failed.log || true
          fi
          [ -s /tmp/failed.log ] || echo "（失败日志不可得，仅凭 job 名修复）" > /tmp/failed.log
          cat > /tmp/prompt.md <<'PROMPT_EOF'
          你在 GitHub Runner 上执行「CI 失败自动修复」任务。

          ## 要求
          1. 阅读仓库根 AGENTS.md 的编码规范并遵守
          2. 定位失败根因，做最小修复：不顺手重构、不改无关文件、不加无关依赖
          3. 修复后运行最窄的相关测试验证（如 pytest 单文件/单测）；无法运行时说明原因
          4. 禁止任何远程 git 操作（push/fetch 远端/开 PR）——推送由外层脚本完成
          5. 最后用一段话总结：根因、修法、验证结果
          6. 禁止通过修改测试断言、删除/跳过测试让失败变绿——那是作弊不是修复。
             若你确信测试本身有误，输出「建议+理由」，不要动手改测试
          7. 若失败呈现 WIP/半成品特征（大量相关文件同批改动、改名改到一半、
             测试先行的 TDD 红），不要尝试修复——输出根因分析报告，交还持有者

          ## PR 意图上下文（判断修复方向用）
          PROMPT_EOF
          {
            echo "- PR 标题: ${PR_TITLE}"
            echo "- PR 描述摘录: ${PR_BODY:0:600}"
            echo "- 近期提交:"
            while IFS= read -r line; do echo "  - ${line}"; done <<< "$PR_RECENT"
            echo ""
            echo "## 失败上下文"
            echo "- PR: #$PR  分支: $BRANCH  失败 HEAD: $SHA"
            [ -n "$RUN_ID" ] && echo "- 失败 run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID"
            echo ""
            echo "## 失败日志摘录（截断）"
            echo '```'
            cat /tmp/failed.log
            echo '```'
          } >> /tmp/prompt.md
          echo "prompt size: $(wc -c < /tmp/prompt.md) bytes"

      # ---- 7. droid 修复执行（BYOK；rc 落输出，不在此步失败） ----
      - name: Run droid autofix exec
        id: exec
        if: steps.cap.outputs.active == 'true'
        run: |
          set -euo pipefail
          RC=0
          droid exec --auto medium -o json -f /tmp/prompt.md | tee /tmp/droid-result.json || RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      # ---- 8. 有 diff 则 commit + PAT 推回原分支（触发新一轮 CI）----
      #     推送前三道结构闸：① 分支未被并发推进 ② 非纯测试改动（防「改断言变绿」）
      #     ③ diff 规模上限（防回退式/大爆炸修复）——Fable 审查 C/E 项
      - name: Commit and push fix
        id: push
        if: steps.cap.outputs.active == 'true' && steps.exec.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR: ${{ steps.ctx.outputs.pr }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          SHA: ${{ steps.ctx.outputs.sha }}
          ATTEMPT: ${{ steps.cap.outputs.attempt }}
        run: |
          set -euo pipefail
          # 改动探测双通道（run 34208803783 教训）：droid 可能只改工作树，
          # 也可能自己 commit 到本地（--auto medium 允许本地 commit）。
          # 只看 porcelain 会把「已本地 commit」误判为无改动而不推送。
          DIRTY=$(git status --porcelain)
          if [ -z "$DIRTY" ] && [ -z "$(git log --oneline "origin/${BRANCH}..HEAD" 2>/dev/null)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes produced; nothing to push"
            exit 0
          fi
          # 闸 1：修复期间分支被并发推进 → 放弃推送（让路活跃执行者）
          git -c credential.helper='!gh auth git-credential' fetch origin "$BRANCH" --quiet
          if [ "$(git rev-parse "origin/${BRANCH}")" != "$SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "push_blocked=branch moved during fix" >> "$GITHUB_OUTPUT"
            echo "::notice::分支在修复期间被推进，放弃本次推送"
            exit 0
          fi
          git config user.name "droid-autofix[bot]"
          git config user.email "droid-autofix[bot]@users.noreply.github.com"
          if [ -n "$DIRTY" ]; then
            git add -A
            git commit -m "fix: droid autofix attempt ${ATTEMPT} for PR #${PR}"
          fi
          # 闸 2：纯 tests/ 改动（疑似弱化测试换绿）→ 不推，只报告
          NON_TEST=$(git diff --name-only "origin/${BRANCH}..HEAD" | grep -vc "^tests/" || true)
          if [ "${NON_TEST:-1}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "push_blocked=diff touches only tests/" >> "$GITHUB_OUTPUT"
            echo "::notice::diff 仅触及 tests/（疑似以改测试换绿），拒绝推送，仅报告根因"
            exit 0
          fi
          # 闸 3：规模上限 → 不推（回退式/大爆炸修复特征）
          FILES=$(git diff --name-only "origin/${BRANCH}..HEAD" | wc -l | tr -d ' ')
          LINES=$(git diff "origin/${BRANCH}..HEAD" | wc -l | tr -d ' ')
          if [ "$FILES" -gt 10 ] || [ "$LINES" -gt 300 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "push_blocked=diff too large (${FILES} files / ${LINES} lines)" >> "$GITHUB_OUTPUT"
            echo "::notice::diff 规模超限（${FILES} 文件 / ${LINES} 行），拒绝推送，仅报告"
            exit 0
          fi
          echo "audit pass: ${FILES} files / ${NON_TEST} non-test files changed"
          # credential helper 走 GH_TOKEN（PAT），值不进命令行与日志
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ---- 9. PR 评论终态报告（sentinel 随评论落库，供上限计数）----
      #     always()（Fable 审查 A/B 项）：push 步骤非零退出（竞态/审计拒推）时
      #     也必须落 sentinel——否则争用场景下 cap 永不递增，恰在最需要时失效
      - name: Report to PR
        if: always() && steps.cap.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR: ${{ steps.ctx.outputs.pr }}
          ATTEMPT: ${{ steps.cap.outputs.attempt }}
          RC: ${{ steps.exec.outputs.rc }}
          CHANGED: ${{ steps.push.outputs.changed }}
          BLOCKED: ${{ steps.push.outputs.push_blocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RC" != "0" ]; then
            BODY="⚠️ droid autofix 第 ${ATTEMPT} 次尝试失败（exec 非零退出，不计改动）。日志：${RUN_URL}"
          elif [ -n "${BLOCKED:-}" ]; then
            SUMMARY=$(jq -r '.result // "（无摘要）"' /tmp/droid-result.json 2>/dev/null | head -c 600 || echo "（无摘要）")
            BODY="🛑 droid autofix 第 ${ATTEMPT} 次分析完成，但推送被结构闸拦下（${BLOCKED}）。根因摘要：${SUMMARY}

          运行记录：${RUN_URL}"
          elif [ "$CHANGED" = "true" ]; then
            SUMMARY=$(jq -r '.result // "（无摘要）"' /tmp/droid-result.json 2>/dev/null | head -c 600 || echo "（无摘要）")
            BODY="🤖 droid autofix 第 ${ATTEMPT} 次修复已推送，CI 将自动重跑。摘要：${SUMMARY}

          运行记录：${RUN_URL}"
          else
            BODY="🤖 droid autofix 第 ${ATTEMPT} 次分析完成但无代码改动（疑似 flaky 或需人工介入）。运行记录：${RUN_URL}"
          fi
          printf '%s\n\n<!-- droid-autofix-attempt-%s -->\n' "$BODY" "$ATTEMPT" > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
