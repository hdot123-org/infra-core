# Self-hosted runner CI pipeline (pve-linux)
# Per-run venv isolation per 2026-08-25-selfhosted-runner-env-shadowing.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: [self-hosted, pve-linux]
    steps:
      - uses: actions/checkout@v5

      - name: Create per-run venv (isolation from runner site-packages)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (parallel: 8 workers, loadgroup for shared-state safety)
        run: pytest -q -n 8 --dist loadgroup

  ruff:
    name: ruff
    runs-on: [self-hosted, pve-linux]
    steps:
      - uses: actions/checkout@v5

      - name: Create per-run venv (isolation from runner site-packages)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

  actionlint:
    name: actionlint
    runs-on: [self-hosted, pve-linux]
    steps:
      - uses: actions/checkout@v5

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash)
          ./actionlint -color

  mypy:
    name: mypy
    runs-on: [self-hosted, pve-linux]
    steps:
      - uses: actions/checkout@v5

      - name: Create per-run venv (isolation from runner site-packages)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy --strict src/infra_core

  ci-ok:
    name: ci-ok
    needs: [pytest, ruff, actionlint, mypy]
    runs-on: [self-hosted, pve-linux]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.pytest.result }}" != "success" ]] || \
             [[ "${{ needs.ruff.result }}" != "success" ]] || \
             [[ "${{ needs.actionlint.result }}" != "success" ]] || \
             [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
