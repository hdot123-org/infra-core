              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - uses: actions/checkout@v5

      - name: Setup venv (per-run isolation)
        uses: ./.github/actions/setup-venv

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

  actionlint:
    name: actionlint
    runs-on: [self-hosted, pve-linux]
    steps:
      - name: Workspace guard (sparse residue detox)
        run: |
          # 2026-08-28 污染事故运行时排毒：共享持久 _work 工作区的 sparse 残留
          # 使 checkout 自带的 sparse-checkout disable 无法恢复被裁剪的工作树
          # （实证：disable 后仍缺 .github/actions/setup-venv）。本步在
          # checkout 前检测残留并删除 .git 强制全新克隆；必须内联 run——
          # 工作树残缺时本地 composite action 同样无法解析。
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -f "$GITHUB_WORKSPACE/.github/actions/setup-venv/action.yml" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - uses: actions/checkout@v5

      - name: Run actionlint
        run: |
          # Layer 1 宿主优先（2026-08-29 node-00 出口对 raw.githubusercontent.com 间歇黑洞，
          # run 33225582434/33231155505 实证 134s timeout 致 main CI 连续三轮红——这是
          # 最后一条每 run 无条件非 git 直连下载路径）。ce-01 runner 已预装
          # /usr/local/bin/actionlint 1.7.11：PATH 命中且版本 ≥1.7 直接使用，零外网下载；
          # 宿主缺失/过旧时 fallback 原 curl 下载路径（保持 GitHub-hosted 兼容）并打
          # ::warning。完整 Layer 1+2 治理见 PR #37，本步为单点最小落地。
          if command -v actionlint >/dev/null 2>&1; then
            HOST_VERSION="$(actionlint --version 2>/dev/null | head -1 | grep -oE '[0-9]+(\.[0-9]+)*' | head -1)" || true
            HOST_MAJOR="${HOST_VERSION%%.*}"
            HOST_MINOR="${HOST_VERSION#*.}"
            HOST_MINOR="${HOST_MINOR%%.*}"
            if [ "${HOST_MAJOR:-0}" -gt 1 ] || { [ "${HOST_MAJOR:-0}" -eq 1 ] && [ "${HOST_MINOR:-0}" -ge 7 ]; }; then
              echo "✓ Using host actionlint: $(actionlint --version | head -1)"
              actionlint -color
            else
              echo "::warning::host actionlint ${HOST_VERSION:-unknown} < 1.7, falling back to download"
              bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash)
              ./actionlint -color
            fi
          else
            echo "::warning::actionlint not found on host, falling back to download"
            bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash)
            ./actionlint -color
          fi

